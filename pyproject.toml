[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logger-mixin"
version = "1.0.0"
description = "Reusable Python logger mixin with file rotation"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["logger_mixin*"]